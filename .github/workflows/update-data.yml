name: Update shared macro archive

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh FinanceCalendar archive and market-impact headlines
        run: node scripts/update-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared-feed.json data/market-headlines.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update shared macro archive"
            git push
          fi
